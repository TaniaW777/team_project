name: eventpass
description: "EventPass: campus events, registration and QR access control."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# Packages of the professor's lab (Lab 3 §3.2). Versions are lower bounds;
# `flutter pub get` resolves the newest compatible ones.
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1 # BLoC / Cubit (F2)
  bloc_concurrency: ^0.3.0 # event transformers (F8)
  equatable: ^2.0.7 # value equality for states, events, entities
  dio: ^5.9.2 # HTTP client with interceptors
  get_it: ^8.2.0 # single DI composition root (F4)
  go_router: ^16.2.0 # declarative navigation + route guard (F5)
  flutter_secure_storage: ^9.2.4 # tokens in Keystore / Keychain (F6)
  shared_preferences: ^2.5.6 # device cache for the events list (F9)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # F12
  bloc_test: ^10.0.0 # F11
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
